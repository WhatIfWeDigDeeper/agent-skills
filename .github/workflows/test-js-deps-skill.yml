name: Test Js Deps Skill

on:
  push:
    branches: [main]
    paths:
      - 'skills/js-deps/**'
      - 'tests/js-deps/**'
  pull_request:
    branches: [main]
    paths:
      - 'skills/js-deps/**'
      - 'tests/js-deps/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: uv run --with pytest pytest tests/js-deps/ -v

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-fixtures
          path: tests/js-deps/fixtures/
          retention-days: 5
